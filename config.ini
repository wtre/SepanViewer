[general]
fps=12
globalOffset=-5
maxWindow=150
mode=auto
# orange: custom RGB (234,140,103); default: game default trigger color.
triggerColor=default
# teal: custom RGB (124,222,239); default: game default side color.
sideColor=default
judgeY=750
# DXcam device/output indexes. The selected game must be on this output.
deviceIndex=0
outputIndex=0
# Reference pixels per millisecond. 0 means learn from successive frames.
initialSpeed=0
minSpeed=0.2
maxSpeed=8.0
noteThreshold=0.82
# Avoid the animated characters near the judgement line.
maxDetectY=610

[customization]
